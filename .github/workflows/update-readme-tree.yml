name: Update README and File Index

on:
  push:
    paths:
      - "**"
  workflow_dispatch:

jobs:
  update-indexes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate README tree and file index
        run: python3 auto_update_readme_tree.py

      - name: Commit generated index changes
        run: |
          if git diff --quiet -- README.md FILE_INDEX.md; then
            echo "Generated indexes are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md FILE_INDEX.md
          git commit -m "Auto-update library indexes [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
